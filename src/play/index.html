<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Pixel Creator</title>
    <style>
        /*
            THE WHOLE STYLESHEET, AND IT IS THIS SHORT ON PURPOSE. This page is a game
            client, not an editor missing its panels (ADR-0042 §5): a surface, and nothing
            around it to read.
        */
        html, body { margin: 0; height: 100%; background: #0b0b0d; overflow: hidden; }
        body { display: grid; place-items: center; }
        canvas { display: block; width: 100%; height: 100%; touch-action: none; }
        .notice {
            position: fixed; inset: 0; display: grid; place-content: center; gap: 0.5rem;
            font: 14px/1.5 ui-sans-serif, system-ui, sans-serif; color: #a8a8b3;
            text-align: center; padding: 2rem;
        }
        .notice strong { color: #e8e8ee; font-weight: 600; font-size: 15px; }
    </style>
</head>
<body>
    <!--
        A mount point, like the Editor's. Nothing about the game is written here: what
        plays is decided by the identifier in the fragment (ADR-0042 §3).
    -->
    <script type="module">
        import { start } from './play.js';
        start();
    </script>
</body>
</html>
